<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AY Bible Games</title>
<meta name="description" content="Simple picture games for church. No sign-in, no typing, works offline.">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body>

<div class="hub">

  <header>
    <h1>AY Bible Games</h1>
    <p class="lede">
      Picture games for the hall. Put one on the projector, let the room shout
      the answers, and click to reveal. Nothing to type, nothing to sign into.
    </p>
  </header>

  <ul class="games" id="games"></ul>

  <footer>
    <p>
      Works with no internet &mdash; open <code>index.html</code> straight from
      the folder. Everything is a plain file you can edit.
    </p>
  </footer>

</div>

<script src="games.js"></script>
<script>
(function () {
  'use strict';

  var list = document.getElementById('games');
  var games = window.GAMES || [];

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  if (!games.length) {
    list.innerHTML = '<li class="game"><p>No games listed yet. ' +
                     'Add one to <code>games.js</code>.</p></li>';
    return;
  }

  games.forEach(function (g) {
    var parked = g.status === 'parked';
    var body =
      '<h2>' + esc(g.title) + '</h2>' +
      '<p>' + esc(g.blurb) + '</p>' +
      '<span class="meta">' + esc(g.meta || '') + '</span>';

    // A parked game is a <li>, not a link - nothing to click, nothing to break.
    list.insertAdjacentHTML('beforeend', parked
      ? '<li class="game parked" aria-disabled="true">' + body + '</li>'
      : '<li><a class="game" href="' + esc(g.href) + '">' + body + '</a></li>');
  });
}());
</script>

</body>
</html>
