<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>San Fernando Adventist Church — AY Bible Games</title>
<link rel="stylesheet" href="core/theme.css">
<style>
  body { overflow: auto; }
  .front { max-width: 60rem; margin: 0 auto; padding: 6vmin 5vmin; }
  .church { font-size: 2vmin; letter-spacing: 0.3em; text-transform: uppercase;
            color: var(--accent); }
  h1 { font-size: 7vmin; margin: 1vmin 0 1rem; }
  .brand { display: flex; align-items: center; gap: 1.2rem; }
  .logo { width: 5.5rem; height: 5.5rem; flex: none; padding: 0.5rem;
          background: var(--fg); border-radius: 50%; }
  .cards { display: grid; gap: 1.5rem; margin-top: 3rem;
           grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr)); }
  .card { display: block; background: var(--card); border-radius: 1rem;
          padding: 1.5rem; text-decoration: none; color: inherit; }
  .card.parked { opacity: 0.45; pointer-events: none; }
  .card h2 { margin: 0 0 0.5rem; font-size: 1.5rem; }
  .card p { margin: 0 0 1rem; color: var(--dim); line-height: 1.5; }
  .meta { font-size: 0.75rem; letter-spacing: 0.2em; text-transform: uppercase;
          color: var(--accent); }
  .keys { margin-top: 2.5rem; display: flex; flex-wrap: wrap; gap: 0.5rem 1.1rem;
          align-items: center; font-size: 0.8rem; color: var(--dim); }
  .keys-title { font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase;
                color: var(--accent); width: 100%; }
  .keys kbd { font: inherit; background: var(--card); border: 1px solid #2c3444;
              border-radius: 0.25rem; padding: 0.1rem 0.4rem; margin-right: 0.25rem;
              color: var(--fg); }
  .gm-link { margin-top: 2rem; font-size: 0.8rem; }
  .gm-link a { color: var(--dim); }
</style>
</head>
<body>
<div class="front">
  <div class="brand">
    <img class="logo" src="games/book-names/images/adventist-logo.png"
         alt="Seventh-day Adventist Church">
    <div>
      <div class="church">San Fernando Adventist Church</div>
      <h1>AY Bible Games</h1>
    </div>
  </div>
  <div class="cards" id="cards"></div>
  <div class="keys">
    <span class="keys-title">Controls</span>
    <span><kbd>Space</kbd> or click — reveal, then next</span>
    <span><kbd>&larr;</kbd> back</span>
    <span><kbd>R</kbd> shuffle</span>
    <span><kbd>O</kbd> deck order</span>
    <span><kbd>F</kbd> fullscreen</span>
    <span><kbd>Home</kbd> restart</span>
    <span><kbd>S</kbd> start screen</span>
    <span><kbd>?</kbd> show these on screen</span>
  </div>
  <p class="gm-link" id="gm-links"></p>
</div>

<script src="games.js"></script>
<script>
  (function () {
    var host = document.getElementById('cards');
    window.GAMES.forEach(function (g) {
      var ready = g.status === 'ready';
      var card = document.createElement(ready ? 'a' : 'div');
      card.className = ready ? 'card' : 'card parked';
      if (ready) { card.href = g.href; }
      var h = document.createElement('h2'); h.textContent = g.title;
      var p = document.createElement('p'); p.textContent = g.blurb;
      var m = document.createElement('div'); m.className = 'meta'; m.textContent = g.meta;
      card.appendChild(h); card.appendChild(p); card.appendChild(m);
      host.appendChild(card);
    });

    // One game-master link per playable game. Hard-coding one was fine with a
    // single game and wrong the moment there were two.
    var gmHost = document.getElementById('gm-links');
    window.GAMES.filter(function (g) { return g.status === 'ready'; })
      .forEach(function (g, i) {
        if (i) { gmHost.appendChild(document.createTextNode(' \u00b7 ')); }
        var a = document.createElement('a');
        a.href = g.href.replace(/index\.html$/, 'gm.html');
        a.textContent = 'Game master: ' + g.title;
        gmHost.appendChild(a);
      });
  })();
</script>
</body>
</html>
