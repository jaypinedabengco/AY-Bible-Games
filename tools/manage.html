<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deck manager — Bible Book Names</title>
<link rel="stylesheet" href="/core/theme.css">
<style>
  body { overflow: auto; }
  .bar { position: sticky; top: 0; z-index: 5; background: var(--bg);
         border-bottom: 1px solid #262d3a; padding: 0.9rem 1.2rem;
         display: flex; gap: 0.8rem; align-items: center; flex-wrap: wrap; }
  .bar h1 { font-size: 1rem; margin: 0; letter-spacing: 0.14em;
            text-transform: uppercase; color: var(--dim); }
  .bar input { flex: 1 1 14rem; font-size: 1rem; padding: 0.5rem 0.8rem;
               border-radius: 0.5rem; border: 1px solid #2c3444;
               background: var(--card); color: var(--fg); }
  .bar .note { font-size: 0.78rem; color: var(--dim); }
  .grid { display: grid; gap: 1rem; padding: 1.2rem;
          grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr)); }
  .cell { background: var(--card); border-radius: 0.8rem; padding: 0.9rem;
          border: 2px dashed transparent; cursor: pointer; }
  .cell.over { border-color: var(--accent); }
  .cell.busy { opacity: 0.5; }
  .cell.done { border-color: var(--good); border-style: solid; }
  .cell img { height: 7rem; max-width: 100%; object-fit: contain;
              background: #0d1017; border-radius: 0.4rem; padding: 0.25rem; }
  .cell .miss { height: 7rem; display: grid; place-items: center; font-size: 2.2rem;
                color: var(--bad); border: 2px dashed var(--bad); border-radius: 0.4rem; }
  .word { font-size: 0.9rem; letter-spacing: 0.08em; color: var(--accent);
          margin-top: 0.45rem; }
  .book { font-size: 1.1rem; font-weight: 700; }
  .file { font-size: 0.65rem; color: var(--dim); word-break: break-all; }
  .hint { font-size: 0.65rem; color: var(--dim); margin-top: 0.5rem; }
  .msg { font-size: 0.68rem; margin-top: 0.4rem; color: var(--good); }
  .msg.bad { color: var(--bad); }
  .tab { font: inherit; font-size: 0.8rem; padding: 0.45rem 0.8rem;
         border-radius: 0.5rem; border: 1px solid #2c3444;
         background: var(--card); color: var(--fg); cursor: pointer; }
  .tab.on { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  .book-row { background: var(--card); border-radius: 0.8rem; padding: 0.9rem 1rem;
              margin-bottom: 0.7rem; }
  .book-row h3 { margin: 0 0 0.1rem; font-size: 1.15rem; }
  .book-row .sub { font-size: 0.68rem; color: var(--dim); letter-spacing: 0.14em;
                   text-transform: uppercase; }
  .vrow { display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap;
          margin-top: 0.6rem; padding-top: 0.6rem; border-top: 1px solid #262d3a; }
  .vrow img { height: 3rem; max-width: 4rem; object-fit: contain;
              background: #0d1017; border-radius: 0.3rem; padding: 0.15rem; }
  .vrow .miss { height: 3rem; width: 2.4rem; display: grid; place-items: center;
                color: var(--bad); border: 2px dashed var(--bad); border-radius: 0.3rem; }
  .vrow label { font-size: 0.65rem; color: var(--dim); letter-spacing: 0.1em;
                text-transform: uppercase; }
  .vrow select, .vrow input[type=text], .vrow input[type=file] {
    font: inherit; font-size: 0.85rem; padding: 0.3rem 0.45rem; border-radius: 0.4rem;
    border: 1px solid #2c3444; background: var(--bg); color: var(--fg); }
  .vrow .why { font-size: 0.62rem; color: var(--dim); flex-basis: 100%; }
  .addbox { display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap;
            margin-top: 0.7rem; padding-top: 0.7rem; border-top: 1px dashed #2c3444; }
  .addbox button { font: inherit; font-size: 0.85rem; padding: 0.4rem 0.9rem;
                   border-radius: 0.5rem; border: none; background: var(--good);
                   color: var(--bg); font-weight: 700; cursor: pointer; }
  .tag { font-size: 0.58rem; letter-spacing: 0.12em; text-transform: uppercase;
         padding: 0.1rem 0.4rem; border-radius: 1rem; background: var(--bg);
         color: var(--dim); margin-left: 0.3rem; }
</style>
</head>
<body>
<div class="bar">
  <h1>Deck manager</h1>
  <select id="game" title="which game you are editing"></select>
  <button id="tab-clues" class="tab on" type="button">pictures</button>
  <button id="tab-vars" class="tab" type="button">variants</button>
  <button id="tab-book" class="tab" type="button">add</button>
  <button id="tab-quotes" class="tab" type="button" style="display:none">quotes</button>
  <button id="tab-waiting" class="tab" type="button" style="display:none">waiting for text</button>
  <button id="tab-trails" class="tab" type="button" style="display:none">trails</button>
  <button id="tab-shopping" class="tab" type="button" style="display:none">pictures to find</button>
  <input id="q" type="search" placeholder="filter by book, id or filename">
  <span class="note" id="count"></span>
  <span class="note">drag a picture onto a card &mdash; or click it</span>
</div>
<div class="grid" id="grid"></div>
<div id="vars" style="display:none;padding:1.2rem"></div>
<div id="newbook" style="display:none;padding:1.2rem;max-width:46rem"></div>
<div id="quotes" style="display:none;padding:1.2rem;max-width:58rem"></div>
<div id="trails" style="display:none;padding:1.2rem;max-width:62rem"></div>

<script>
(function () {
  // Which game this page is editing. It lives in the URL rather than in a
  // variable, so a reload, a bookmark or a second window all stay on the game
  // you were working on - and so a picture can never be posted to one deck
  // while the page thinks it is looking at another.
  var GAME = (location.search.match(/[?&]game=([^&]*)/) || [null, 'book-names'])[1];
  // Filled in once /api/games answers. Anything drawn before then must cope
  // with it being null.
  var GAME_META = null;
  function api(u) { return u + (u.indexOf('?') === -1 ? '?' : '&') + 'game=' + encodeURIComponent(GAME); }
  function imgUrl(name) { return '/games/' + GAME + '/images/' + name; }

  var grid = document.getElementById('grid');
  var q = document.getElementById('q');
  var countEl = document.getElementById('count');
  var clues = [];

  function el(t, c, x) {
    var n = document.createElement(t);
    if (c) { n.className = c; }
    if (x != null) { n.textContent = x; }
    return n;
  }

  function upload(clue, file, cell, msg) {
    var ext = (file.name.match(/\.[^.]+$/) || [''])[0].toLowerCase();
    if (!ext) {
      msg.className = 'msg bad';
      msg.textContent = 'that file has no extension';
      return;
    }
    cell.classList.add('busy');
    msg.className = 'msg';
    msg.textContent = 'saving…';
    var fr = new FileReader();
    fr.onload = function () {
      var b64 = String(fr.result).split(',')[1];
      fetch(api('/api/replace'), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ file: clue.file, ext: ext, data: b64 })
      }).then(function (r) { return r.json(); }).then(function (out) {
        cell.classList.remove('busy');
        if (out.error) {
          msg.className = 'msg bad';
          msg.textContent = out.error;
          return;
        }
        cell.classList.add('done');
        msg.className = 'msg';
        msg.textContent = out.sized + ' · ' + out.deckNote;
        clue.file = out.file;
        clue.missing = false;
        var img = cell.querySelector('img');
        if (img) {
          img.src = imgUrl(out.file) + '?t=' + Date.now();
        }
        var f = cell.querySelector('.file');
        if (f) { f.textContent = out.file; }
      }).catch(function (e) {
        cell.classList.remove('busy');
        msg.className = 'msg bad';
        msg.textContent = String(e.message || e);
      });
    };
    fr.readAsDataURL(file);
  }

  function card(clue) {
    var cell = el('div', 'cell');
    var msg = el('div', 'msg');

    if (clue.missing) {
      var miss = el('div', 'miss', '?');
      miss.title = clue.file + ' is not in the folder yet';
      cell.appendChild(miss);
    } else {
      var img = document.createElement('img');
      img.src = imgUrl(clue.file);
      img.alt = clue.file;
      img.loading = 'lazy';
      cell.appendChild(img);
    }

    if (clue.word) { cell.appendChild(el('div', 'word', clue.word)); }
    var b = el('div', 'book', clue.answer);
    if (clue.many) { b.appendChild(el('span', 'tag', 'variant ' + (clue.variant + 1))); }
    cell.appendChild(b);
    cell.appendChild(el('div', 'file', clue.file));
    cell.appendChild(el('div', 'hint',
      '#' + clue.id + (clue.missing ? ' · not sourced yet' : '')));
    cell.appendChild(msg);

    var picker = document.createElement('input');
    picker.type = 'file';
    picker.accept = 'image/*';
    picker.style.display = 'none';
    picker.addEventListener('change', function () {
      if (picker.files[0]) { upload(clue, picker.files[0], cell, msg); }
    });
    cell.appendChild(picker);
    cell.addEventListener('click', function () { picker.click(); });

    ['dragenter', 'dragover'].forEach(function (ev) {
      cell.addEventListener(ev, function (e) {
        e.preventDefault();
        cell.classList.add('over');
      });
    });
    ['dragleave', 'drop'].forEach(function (ev) {
      cell.addEventListener(ev, function () { cell.classList.remove('over'); });
    });
    cell.addEventListener('drop', function (e) {
      e.preventDefault();
      var f = e.dataTransfer.files && e.dataTransfer.files[0];
      if (f) { upload(clue, f, cell, msg); }
    });

    return cell;
  }

  function draw() {
    var term = q.value.trim().toLowerCase();
    grid.innerHTML = '';
    var shown = 0;
    clues.forEach(function (c) {
      var hay = (c.answer + ' ' + c.id + ' ' + c.file + ' ' + (c.word || '')).toLowerCase();
      if (term && hay.indexOf(term) === -1) { return; }
      grid.appendChild(card(c));
      shown++;
    });
    var missing = clues.filter(function (c) { return c.missing; }).length;
    countEl.textContent = shown + ' of ' + clues.length + ' clues'
      + (missing ? ' · ' + missing + ' not sourced' : '');
  }

  // ---- variants view -----------------------------------------------------
  var varsHost = document.getElementById('vars');

  function say(node, text, bad) {
    node.textContent = text;
    node.style.color = bad ? 'var(--bad)' : 'var(--good)';
  }

  function numSelect(label, value, from, to, onChange, help) {
    var wrap = el('span');
    wrap.appendChild(el('label', null, label));
    var sel = document.createElement('select');
    for (var i = from; i <= to; i++) {
      var o = document.createElement('option');
      o.value = String(i);
      o.textContent = String(i);
      if (i === value) { o.selected = true; }
      sel.appendChild(o);
    }
    sel.title = help || '';
    sel.addEventListener('change', function () { onChange(Number(sel.value)); });
    wrap.appendChild(document.createTextNode(' '));
    wrap.appendChild(sel);
    return wrap;
  }

  function bookRow(book) {
    var row = el('div', 'book-row');
    row.appendChild(el('h3', null, book.answer));
    row.appendChild(el('div', 'sub', '#' + book.id + ' · '
      + book.variants.length + (book.variants.length === 1 ? ' variant' : ' variants')));

    book.variants.forEach(function (v, vi) {
      var vr = el('div', 'vrow');
      v.files.forEach(function (f) {
        var img = document.createElement('img');
        img.src = imgUrl(f);
        img.alt = f;
        img.loading = 'lazy';
        img.addEventListener('error', function () {
          var m = el('div', 'miss', '?');
          m.title = f + ' not sourced yet';
          img.replaceWith(m);
        });
        vr.appendChild(img);
      });
      vr.appendChild(el('span', 'tag', v.type));

      var msg = el('span', 'why');

      // The words themselves are editable: a picture that reads wrong is often
      // a wording problem rather than a picture problem.
      if (v.words.length) {
        var wordBox = el('div');
        wordBox.style.cssText = 'display:flex;gap:0.35rem;align-items:center;flex-wrap:wrap';
        wordBox.appendChild(el('label', null, 'words'));
        var inputs = v.words.map(function (w, wi) {
          var t = document.createElement('input');
          t.type = 'text';
          t.size = Math.max(6, String(w || '').length + 2);
          t.value = w === null || w === undefined ? '' : w;
          t.placeholder = 'picture ' + (wi + 1);
          wordBox.appendChild(t);
          return t;
        });
        var saveWords = document.createElement('button');
        saveWords.type = 'button';
        saveWords.textContent = 'save words';
        saveWords.style.cssText = 'background:var(--card);color:var(--fg);border:1px solid #2c3444;'
          + 'border-radius:0.5rem;padding:0.3rem 0.7rem;cursor:pointer;font:inherit;font-size:0.78rem';
        saveWords.addEventListener('click', function () {
          var words = inputs.map(function (t) { return t.value; });
          post('/api/set-variant', { id: book.id, index: vi, words: words }, msg,
               'now reads ' + words.join(' + '));
        });
        wordBox.appendChild(saveWords);
        vr.appendChild(wordBox);
      }

      // Weight only decides between variants, so a single-variant book does not
      // get the control at all - showing a dead one invites setting it.
      if (!book.single) {
        vr.appendChild(numSelect('weight', v.weight, 1, 9, function (n) {
          post('/api/set-variant', { id: book.id, index: vi, weight: n }, msg,
               'weight ' + n + ' — drawn ' + n + '\u00d7 as often as a weight-1 variant');
        }, 'How often this variant is picked, against the others'));
      }

      vr.appendChild(numSelect('difficulty', v.difficulty, 1, 3, function (n) {
        post('/api/set-variant', { id: book.id, index: vi, difficulty: n }, msg,
             'difficulty ' + n + ' — ' + (n === 1 ? 'plays early' : n === 3 ? 'plays late' : 'plays in the middle'));
      }, '1 plays early in a round, 3 plays late'));

      vr.appendChild(msg);
      if (book.single) {
        vr.appendChild(el('span', 'why',
          'one variant only — weight starts counting once a second one is added'));
      }
      row.appendChild(vr);
    });

    // ---- add a variant: one picture, or several for a rebus ---------------
    var add = el('div', 'addbox');
    var slots = el('div');
    slots.style.cssText = 'display:flex;flex-direction:column;gap:0.4rem;flex-basis:100%';

    function addSlot() {
      var slot = el('div');
      slot.style.cssText = 'display:flex;gap:0.5rem;align-items:center;flex-wrap:wrap';
      var f = document.createElement('input');
      f.type = 'file';
      f.accept = 'image/*';
      var w = document.createElement('input');
      w.type = 'text';
      w.size = 22;
      w.placeholder = 'clue word — blank on a single picture means the whole picture IS the clue';
      var drop = document.createElement('button');
      drop.type = 'button';
      drop.textContent = '\u2212';
      drop.title = 'remove this picture';
      drop.style.cssText = 'background:var(--card);color:var(--dim);border:1px solid #2c3444;'
        + 'border-radius:0.4rem;padding:0.25rem 0.6rem;cursor:pointer;font:inherit';
      drop.addEventListener('click', function () {
        if (slots.children.length > 1) { slot.remove(); }
      });
      slot.appendChild(f);
      slot.appendChild(w);
      slot.appendChild(drop);
      slots.appendChild(slot);
      return slot;
    }
    addSlot();

    var more = document.createElement('button');
    more.type = 'button';
    more.textContent = '+ another picture';
    more.style.cssText = 'background:var(--card);color:var(--fg);border:1px solid #2c3444;'
      + 'border-radius:0.5rem;padding:0.35rem 0.7rem;cursor:pointer;font:inherit;font-size:0.8rem';
    more.addEventListener('click', function () { addSlot(); });

    var wSel = numSelect('weight', 1, 1, 9, function () {}, 'How often it is picked');
    var dSel = numSelect('difficulty', 1, 1, 3, function () {}, '1 early, 3 late');
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = 'add variant';
    var addMsg = el('span', 'why');

    btn.addEventListener('click', function () {
      var rows = [].slice.call(slots.children);
      var picked = rows.map(function (r) {
        return { file: r.querySelector('input[type=file]').files[0],
                 word: r.querySelector('input[type=text]').value };
      }).filter(function (x) { return x.file; });
      if (!picked.length) { say(addMsg, 'choose at least one picture', true); return; }

      say(addMsg, 'saving…');
      Promise.all(picked.map(function (x) {
        return new Promise(function (resolve, reject) {
          var fr = new FileReader();
          fr.onload = function () {
            resolve({
              ext: (x.file.name.match(/\.[^.]+$/) || [''])[0].toLowerCase(),
              word: x.word,
              data: String(fr.result).split(',')[1],
            });
          };
          fr.onerror = reject;
          fr.readAsDataURL(x.file);
        });
      })).then(function (clues) {
        return fetch(api('/api/add-variant'), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            id: book.id, clues: clues,
            weight: Number(wSel.querySelector('select').value),
            difficulty: Number(dSel.querySelector('select').value),
          }),
        }).then(function (r) { return r.json(); });
      }).then(function (out) {
        if (out.error) { say(addMsg, out.error, true); return; }
        say(addMsg, out.files.join(' + ') + ' · ' + out.note);
        loadBooks();
      }).catch(function (e) { say(addMsg, String(e.message || e), true); });
    });

    add.appendChild(slots);
    add.appendChild(more);
    add.appendChild(wSel);
    add.appendChild(dSel);
    add.appendChild(btn);
    add.appendChild(addMsg);
    row.appendChild(add);
    return row;
  }

  function post(url, body, msg, okText) {
    say(msg, 'saving…');
    fetch(api(url), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    }).then(function (r) { return r.json(); }).then(function (out) {
      if (out.error) { say(msg, out.error, true); return; }
      say(msg, okText);
    }).catch(function (e) { say(msg, String(e.message || e), true); });
  }

  function loadBooks() {
    fetch(api('/api/books')).then(function (r) { return r.json(); }).then(function (books) {
      varsHost.innerHTML = '';
      books.forEach(function (b) { varsHost.appendChild(bookRow(b)); });
    });
  }

  // ---- add a book, or a character ---------------------------------------
  var bookHost = document.getElementById('newbook');
  var KIND = 'book';

  function newBookView() {
    bookHost.innerHTML = '';
    var box = el('div', 'book-row');
    box.appendChild(el('h3', null, 'Add a ' + KIND));
    var sub = el('div', 'sub', 'loading…');
    box.appendChild(sub);
    bookHost.appendChild(box);

    fetch(api('/api/missing-books')).then(function (r) { return r.json(); }).then(function (list) {
      if (list.error) { sub.textContent = list.error; return; }

      // A book comes from the canon, so it is chosen from what is missing and
      // its reference is filled in. A character is typed: there is no closed
      // list of Bible characters to pick from.
      var pick, noteBox;
      var picked = el('div', 'vrow');
      if (KIND === 'book') {
        sub.textContent = list.length + ' of the 66 books are not in the deck yet';
        pick = document.createElement('select');
        list.forEach(function (b) {
          var o = document.createElement('option');
          o.value = b.answer;
          o.textContent = b.answer + '  —  ' + b.testament + ' Testament · ' + b.division
            + ' · book ' + b.position + ' of 66';
          pick.appendChild(o);
        });
        picked.appendChild(el('label', null, 'book'));
        picked.appendChild(pick);
        picked.appendChild(el('span', 'why',
          'the reference is filled in from the canon — you do not have to look it up'));
      } else {
        sub.textContent = 'the name the room shouts, and one line to teach after the reveal';
        pick = document.createElement('input');
        pick.type = 'text';
        pick.size = 18;
        pick.placeholder = 'MOSES';
        pick.addEventListener('input', function () { pick.value = pick.value.toUpperCase(); });
        noteBox = document.createElement('input');
        noteBox.type = 'text';
        noteBox.size = 30;
        noteBox.placeholder = 'Exodus 3 · led Israel out of Egypt';
        picked.appendChild(el('label', null, 'name'));
        picked.appendChild(pick);
        picked.appendChild(el('label', null, 'note'));
        picked.appendChild(noteBox);
        picked.appendChild(el('span', 'why',
          'the note prints small under the answer — keep the name out of it, '
          + 'it is the one line you get to teach something'));
      }
      box.appendChild(picked);

      // picture slots, same shape as the add-variant form
      var slots = el('div');
      slots.style.cssText = 'display:flex;flex-direction:column;gap:0.4rem;margin-top:0.7rem';
      function addSlot() {
        var slot = el('div');
        slot.style.cssText = 'display:flex;gap:0.5rem;align-items:center;flex-wrap:wrap';
        var f = document.createElement('input');
        f.type = 'file';
        f.accept = 'image/*';
        var w = document.createElement('input');
        w.type = 'text';
        w.size = 22;
        w.placeholder = 'clue word — blank on a single picture means the picture IS the clue';
        var drop = document.createElement('button');
        drop.type = 'button';
        drop.textContent = '\u2212';
        drop.style.cssText = 'background:var(--card);color:var(--dim);border:1px solid #2c3444;'
          + 'border-radius:0.4rem;padding:0.25rem 0.6rem;cursor:pointer;font:inherit';
        drop.addEventListener('click', function () {
          if (slots.children.length > 1) { slot.remove(); }
        });
        slot.appendChild(f); slot.appendChild(w); slot.appendChild(drop);
        slots.appendChild(slot);
      }
      addSlot();
      box.appendChild(slots);

      var controls = el('div', 'addbox');
      var more = document.createElement('button');
      more.type = 'button';
      more.textContent = '+ another picture';
      more.style.cssText = 'background:var(--card);color:var(--fg);border:1px solid #2c3444;'
        + 'border-radius:0.5rem;padding:0.35rem 0.7rem;cursor:pointer;font:inherit;font-size:0.8rem';
      more.addEventListener('click', function () { addSlot(); });
      var dSel = numSelect('difficulty', 2, 1, 3, function () {}, '1 plays early, 3 plays late');
      var go = document.createElement('button');
      go.type = 'button';
      go.textContent = 'add ' + KIND;
      var msg = el('span', 'why');

      go.addEventListener('click', function () {
        var chosen = [].slice.call(slots.children).map(function (r) {
          return { file: r.querySelector('input[type=file]').files[0],
                   word: r.querySelector('input[type=text]').value };
        }).filter(function (x) { return x.file; });
        if (!chosen.length) { say(msg, 'choose at least one picture', true); return; }
        if (!String(pick.value).trim()) { say(msg, 'type a name first', true); return; }
        say(msg, 'saving…');
        Promise.all(chosen.map(function (x) {
          return new Promise(function (resolve, reject) {
            var fr = new FileReader();
            fr.onload = function () {
              resolve({ ext: (x.file.name.match(/\.[^.]+$/) || [''])[0].toLowerCase(),
                        word: x.word, data: String(fr.result).split(',')[1] });
            };
            fr.onerror = reject;
            fr.readAsDataURL(x.file);
          });
        })).then(function (clues) {
          return fetch(api('/api/add-book'), {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              answer: String(pick.value).trim(), clues: clues,
              note: noteBox ? noteBox.value : undefined,
              difficulty: Number(dSel.querySelector('select').value),
            }),
          }).then(function (r) { return r.json(); });
        }).then(function (out) {
          if (out.error) { say(msg, out.error, true); return; }
          say(msg, out.answer + ' added as ' + out.id + ' · ' + out.files.join(' + ')
            + ' · the deck now has ' + out.total);
          newBookView();
        }).catch(function (e) { say(msg, String(e.message || e), true); });
      });

      controls.appendChild(more);
      controls.appendChild(dSel);
      controls.appendChild(go);
      controls.appendChild(msg);
      box.appendChild(controls);
    });
  }

  // ---- quotes ------------------------------------------------------------
  var quoteHost = document.getElementById('quotes');
  var waitingOnly = false;

  function field(label, value, size, placeholder) {
    var wrap = el('div');
    wrap.style.cssText = 'display:flex;gap:0.4rem;align-items:center;flex:1 1 auto';
    wrap.appendChild(el('label', null, label));
    var input = document.createElement('input');
    input.type = 'text';
    input.value = value === null || value === undefined ? '' : value;
    if (size) { input.size = size; }
    if (placeholder) { input.placeholder = placeholder; }
    input.style.flex = '1 1 auto';
    wrap.appendChild(input);
    wrap.input = input;
    return wrap;
  }

  function quoteBlock(row, v, vi) {
    var box = el('div', 'vrow');
    box.style.cssText += ';flex-direction:column;align-items:stretch';

    var head = el('div');
    head.style.cssText = 'display:flex;gap:0.5rem;align-items:center;flex-wrap:wrap';
    head.appendChild(el('span', 'tag', v.lang === 'fil' ? 'Tagalog' : 'English'));
    if (v.waiting) { head.appendChild(el('span', 'tag', 'waiting for text')); }
    if (v.unverified && !v.waiting) { head.appendChild(el('span', 'tag', 'unverified')); }
    box.appendChild(head);

    // The line itself. A textarea rather than an input: a quote is a sentence,
    // and typing one into a single-line box that scrolls sideways is how
    // mistakes get missed.
    var ta = document.createElement('textarea');
    ta.rows = 2;
    ta.value = v.quote || '';
    ta.placeholder = v.lang === 'fil'
      ? 'paste the Magandang Balita Biblia line here'
      : 'the line, NKJV';
    ta.style.cssText = 'width:100%;font:inherit;font-size:0.9rem;line-height:1.4;'
      + 'padding:0.5rem 0.6rem;border-radius:0.5rem;border:1px solid #2c3444;'
      + 'background:var(--bg);color:var(--fg);resize:vertical';
    box.appendChild(ta);

    var meta = el('div');
    meta.style.cssText = 'display:flex;gap:0.6rem;align-items:center;flex-wrap:wrap';
    var verse = field('verse', v.verse, 14, 'Mateo 16:16');
    var clue = field('clue', v.clue, 30, 'one line that does not name them');
    meta.appendChild(verse);
    meta.appendChild(clue);
    box.appendChild(meta);

    var name = null;
    var controls = el('div');
    controls.style.cssText = 'display:flex;gap:0.7rem;align-items:center;flex-wrap:wrap';
    if (v.lang === 'fil') {
      name = field('name', v.answer, 14, 'PEDRO');
      controls.appendChild(name);
    }

    var msg = el('span', 'why');
    controls.appendChild(numSelect('difficulty', v.difficulty, 1, 3, function (n) {
      post('/api/set-quote', { id: row.id, index: vi, difficulty: n }, msg,
           'difficulty ' + n + ' — ' + (n === 1 ? 'plays early' : n === 3 ? 'plays late' : 'plays in the middle'));
    }, '1 is a line the room shouts instantly, 3 needs the clue'));

    var tick = document.createElement('label');
    // This used to borrow the style off the "hold the verse" checkbox, which
    // was removed from the game - leaving a reference to a variable that no
    // longer existed. It threw on the FIRST quote block, so the whole quotes
    // tab rendered empty with the reason only in the console: both quote
    // games were unmanageable and nothing said why.
    tick.style.cssText = 'display:flex;gap:0.35rem;align-items:center;'
      + 'font-size:0.8rem;color:var(--dim);cursor:pointer';
    var tickBox = document.createElement('input');
    tickBox.type = 'checkbox';
    tickBox.checked = !v.unverified;
    tickBox.addEventListener('change', function () {
      post('/api/set-quote', { id: row.id, index: vi, verified: tickBox.checked }, msg,
           tickBox.checked ? 'checked against the Bible' : 'back to unverified');
    });
    tick.appendChild(tickBox);
    tick.appendChild(document.createTextNode(
      (GAME_META && GAME_META.checkLabel) || 'wording checked'));
    controls.appendChild(tick);

    var save = document.createElement('button');
    save.type = 'button';
    save.textContent = 'save';
    save.style.cssText = 'background:var(--card);color:var(--fg);border:1px solid #2c3444;'
      + 'border-radius:0.5rem;padding:0.35rem 0.9rem;cursor:pointer;font:inherit;font-size:0.8rem';
    save.addEventListener('click', function () {
      var body = { id: row.id, index: vi, quote: ta.value,
                   verse: verse.input.value, clue: clue.input.value };
      if (name) { body.answer = name.input.value; }
      post('/api/set-quote', body, msg, 'saved');
      if (waitingOnly && ta.value.trim()) { setTimeout(loadQuotes, 400); }
    });
    controls.appendChild(save);
    controls.appendChild(msg);
    box.appendChild(controls);

    if (v.lang === 'fil' && v.waiting) {
      box.appendChild(el('span', 'why',
        'The MBB text is the Philippine Bible Society’s, so it is not committed '
        + 'here until you paste it in. Until then this one is dormant and never drawn.'));
    }
    return box;
  }

  function loadQuotes() {
    fetch(api('/api/quotes')).then(function (r) { return r.json(); }).then(function (rows) {
      quoteHost.innerHTML = '';
      if (rows.error) { quoteHost.appendChild(el('p', null, rows.error)); return; }
      var shown = 0;
      var waiting = 0;
      rows.forEach(function (row) {
        var vs = row.variants
          .map(function (v, i) { return { v: v, i: i }; })
          .filter(function (x) { return !waitingOnly || x.v.waiting; });
        row.variants.forEach(function (v) { if (v.waiting) { waiting++; } });
        if (!vs.length) { return; }
        var block = el('div', 'book-row');
        block.appendChild(el('h3', null, row.answer));
        block.appendChild(el('div', 'sub', '#' + row.id + ' · '
          + row.variants.length + (row.variants.length === 1 ? ' quote' : ' quotes')));
        vs.forEach(function (x) { block.appendChild(quoteBlock(row, x.v, x.i)); });
        quoteHost.appendChild(block);
        shown++;
      });
      countEl.textContent = shown + ' of ' + rows.length + ' people'
        + (waiting ? ' · ' + waiting + ' waiting for text' : '');
      if (!shown) {
        quoteHost.appendChild(el('p', null, waitingOnly
          ? 'Nothing is waiting for text. Every quote has its line.'
          : 'This deck has no quotes yet.'));
      }
    });
  }

  // ---- object trails -----------------------------------------------------
  var trailHost = document.getElementById('trails');
  var shoppingOnly = false;
  // 274 objects is a wall to stare at. These two make it a list you can work
  // through: the quickest wins first, and one trail per person so a whole
  // round can be illustrated before anything is done twice.
  var quickestFirst = true;
  var onePerPerson = false;

  function objectCard(row, trail, step, pic) {
    var card = el('div');
    card.style.cssText = 'display:flex;flex-direction:column;gap:0.3rem;'
      + 'align-items:center;min-width:6.5rem';

    if (pic.img && !pic.missing) {
      var img = document.createElement('img');
      img.src = imgUrl(pic.img);
      img.alt = pic.word || '';
      img.loading = 'lazy';
      img.style.cssText = 'height:4.5rem;max-width:6rem;object-fit:contain;'
        + 'background:var(--bg);border-radius:0.4rem;padding:0.2rem';
      card.appendChild(img);
    } else {
      // The words-only state is the NORMAL one here, not a fault: the deck is
      // written in words and grows pictures. So it is a dashed invitation, not
      // a red error.
      var box = el('div', null, 'no picture');
      box.style.cssText = 'height:4.5rem;width:6rem;display:grid;place-items:center;'
        + 'border:1px dashed #3a4354;border-radius:0.4rem;color:var(--dim);'
        + 'font-size:0.62rem;letter-spacing:0.08em;text-transform:uppercase';
      card.appendChild(box);
    }

    card.appendChild(el('div', null, pic.word || '(no word)'));
    card.lastChild.style.cssText = 'font-size:0.85rem;text-align:center';

    // What to hunt for. Shown only here - it is often longer than the word the
    // projector shows, because it does not have to fit a screen.
    if (pic.find && pic.find !== pic.word) {
      var hint = el('div', null, pic.find);
      hint.style.cssText = 'font-size:0.66rem;color:var(--dim);text-align:center;'
        + 'max-width:9rem;line-height:1.35';
      card.appendChild(hint);
    }

    var msg = el('div', 'why');
    msg.style.cssText = 'font-size:0.6rem;text-align:center;min-height:0.8rem';

    var picker = document.createElement('input');
    picker.type = 'file';
    picker.accept = 'image/*';
    picker.style.display = 'none';
    picker.addEventListener('change', function () {
      var f = picker.files[0];
      if (!f) { return; }
      var ext = (f.name.match(/\.[^.]+$/) || [''])[0].toLowerCase();
      say(msg, 'saving…');
      var fr = new FileReader();
      fr.onload = function () {
        fetch(api('/api/trail-picture'), {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            id: row.id, object: pic.object, word: pic.word, answer: row.answer,
            ext: ext, data: String(fr.result).split(',')[1],
          }),
        }).then(function (r) { return r.json(); }).then(function (out) {
          if (out.error) { say(msg, out.error, true); return; }
          say(msg, out.file);
          loadTrails();
        }).catch(function (e) { say(msg, String(e.message || e), true); });
      };
      fr.readAsDataURL(f);
    });
    card.appendChild(picker);

    var pick = document.createElement('button');
    pick.type = 'button';
    pick.textContent = pic.missing ? 'add picture' : 'replace';
    pick.style.cssText = 'font:inherit;font-size:0.65rem;padding:0.2rem 0.5rem;'
      + 'border-radius:0.4rem;border:1px solid #2c3444;background:var(--card);'
      + 'color:var(--fg);cursor:pointer';
    pick.addEventListener('click', function () { picker.click(); });
    card.appendChild(pick);
    card.appendChild(msg);

    // drag a picture straight onto the object
    ['dragenter', 'dragover'].forEach(function (ev) {
      card.addEventListener(ev, function (e) { e.preventDefault(); card.style.opacity = '0.6'; });
    });
    ['dragleave', 'drop'].forEach(function (ev) {
      card.addEventListener(ev, function () { card.style.opacity = '1'; });
    });
    card.addEventListener('drop', function (e) {
      e.preventDefault();
      var f = e.dataTransfer.files && e.dataTransfer.files[0];
      if (!f) { return; }
      var dt = new DataTransfer();
      dt.items.add(f);
      picker.files = dt.files;
      picker.dispatchEvent(new Event('change'));
    });

    return card;
  }

  function trailBlock(row) {
    var box = el('div', 'book-row');
    var missing = 0;
    var total = 0;
    row.trails.forEach(function (t) {
      t.steps.forEach(function (st) {
        st.pictures.forEach(function (p) { total++; if (p.missing) { missing++; } });
      });
    });

    box.appendChild(el('h3', null, row.answer));
    box.appendChild(el('div', 'sub', '#' + row.id + ' · '
      + row.trails.length + (row.trails.length === 1 ? ' trail' : ' trails')
      + ' · ' + (total - missing) + ' of ' + total + ' pictures found'));

    row.trails.forEach(function (t) {
      var wrap = el('div', 'vrow');
      wrap.style.cssText += ';flex-direction:column;align-items:stretch';
      if (row.trails.length > 1) {
        wrap.appendChild(el('span', 'tag', 'trail ' + (t.index + 1)
          + ' · difficulty ' + t.difficulty));
      }
      t.steps.forEach(function (st) {
        var stepRow = el('div');
        stepRow.style.cssText = 'display:flex;gap:0.8rem;align-items:flex-start;'
          + 'flex-wrap:wrap;padding:0.4rem 0';
        var n = el('span', 'tag', 'step ' + (st.index + 1));
        n.style.marginTop = '1.6rem';
        stepRow.appendChild(n);
        st.pictures.forEach(function (p) {
          stepRow.appendChild(objectCard(row, t, st, p));
        });
        if (st.verse) {
          var v = el('span', 'word', st.verse);
          v.style.marginTop = '1.6rem';
          v.title = 'shown only at the reveal';
          stepRow.appendChild(v);
        }
        wrap.appendChild(stepRow);
      });
      box.appendChild(wrap);
    });
    return box;
  }

  function trailControls(missing) {
    var bar = el('div', 'addbox');
    bar.style.marginBottom = '0.8rem';

    function toggle(label, get, set, help) {
      var wrap = document.createElement('label');
      wrap.style.cssText = 'display:flex;gap:0.35rem;align-items:center;'
        + 'font-size:0.7rem;letter-spacing:0.08em;text-transform:uppercase;'
        + 'color:var(--dim);cursor:pointer';
      var box = document.createElement('input');
      box.type = 'checkbox';
      box.checked = get();
      box.addEventListener('change', function () { set(box.checked); loadTrails(); });
      wrap.appendChild(box);
      wrap.appendChild(document.createTextNode(label));
      wrap.title = help || '';
      return wrap;
    }

    bar.appendChild(toggle('quickest trails first',
      function () { return quickestFirst; },
      function (v) { quickestFirst = v; },
      'Finish a whole trail in two or three pictures rather than picking at a big one'));
    bar.appendChild(toggle('one trail per person',
      function () { return onePerPerson; },
      function (v) { onePerPerson = v; },
      'Illustrate every person once before doing anyone twice'));
    bar.appendChild(el('span', 'why',
      missing + ' objects still to find. A trail is done at four pictures on '
      + 'average, and a finished trail plays with pictures while everything '
      + 'else keeps playing in words.'));
    return bar;
  }

  function loadTrails() {
    fetch(api('/api/trails')).then(function (r) { return r.json(); }).then(function (rows) {
      trailHost.innerHTML = '';
      if (rows.error) { trailHost.appendChild(el('p', null, rows.error)); return; }

      var term = q.value.trim().toLowerCase();
      var missing = 0;
      var total = 0;
      rows.forEach(function (row) {
        row.trails.forEach(function (t) {
          t.steps.forEach(function (st) {
            st.pictures.forEach(function (p) { total++; if (p.missing) { missing++; } });
          });
        });
      });

      if (shoppingOnly) { trailHost.appendChild(trailControls(missing)); }

      var order = rows.slice();
      if (shoppingOnly && onePerPerson) {
        order = order.map(function (row) {
          return Object.assign({}, row, { trails: row.trails.slice(0, 1) });
        });
      }
      if (shoppingOnly && quickestFirst) {
        // fewest pictures outstanding first, so something gets FINISHED
        var left = function (row) {
          var n = 0;
          row.trails.forEach(function (t) {
            t.steps.forEach(function (st) {
              st.pictures.forEach(function (p) { if (p.missing) { n++; } });
            });
          });
          return n;
        };
        order.sort(function (a, b) { return left(a) - left(b); });
      }

      var shown = 0;
      order.forEach(function (row) {
        if (term && row.answer.toLowerCase().indexOf(term) === -1
                 && row.id.toLowerCase().indexOf(term) === -1) { return; }
        if (shoppingOnly) {
          // Only what is still to find, and only the objects that need it.
          var hasMissing = row.trails.some(function (t) {
            return t.steps.some(function (st) {
              return st.pictures.some(function (p) { return p.missing; });
            });
          });
          if (!hasMissing) { return; }
          var trimmed = {
            id: row.id, answer: row.answer, difficulty: row.difficulty,
            trails: row.trails.map(function (t) {
              return {
                index: t.index, difficulty: t.difficulty,
                steps: t.steps.map(function (st) {
                  return {
                    index: st.index, verse: st.verse,
                    pictures: st.pictures.filter(function (p) { return p.missing; }),
                  };
                }).filter(function (st) { return st.pictures.length; }),
              };
            }).filter(function (t) { return t.steps.length; }),
          };
          trailHost.appendChild(trailBlock(trimmed));
        } else {
          trailHost.appendChild(trailBlock(row));
        }
        shown++;
      });

      countEl.textContent = total + ' objects · ' + (total - missing) + ' found · '
        + missing + ' still to find';
      if (!shown) {
        trailHost.appendChild(el('p', null, shoppingOnly
          ? 'Every object has a picture. Nothing left to find.'
          : 'This deck has no trails yet.'));
      }
    });
  }

  var tabTrails = document.getElementById('tab-trails');
  var tabShopping = document.getElementById('tab-shopping');
  var tabQuotes = document.getElementById('tab-quotes');
  var tabWaiting = document.getElementById('tab-waiting');
  var tabBook = document.getElementById('tab-book');
  var tabClues = document.getElementById('tab-clues');
  var tabVars = document.getElementById('tab-vars');
  function showTab(which) {
    [tabClues, tabVars, tabBook, tabQuotes, tabWaiting, tabTrails, tabShopping]
      .forEach(function (t) { t.classList.remove('on'); });
    grid.style.display = 'none';
    varsHost.style.display = 'none';
    bookHost.style.display = 'none';
    quoteHost.style.display = 'none';
    trailHost.style.display = 'none';
    if (which === 'trails' || which === 'shopping') {
      shoppingOnly = which === 'shopping';
      (shoppingOnly ? tabShopping : tabTrails).classList.add('on');
      trailHost.style.display = '';
      loadTrails();
      return;
    }
    if (which === 'clues') { tabClues.classList.add('on'); grid.style.display = ''; }
    if (which === 'vars') { tabVars.classList.add('on'); varsHost.style.display = ''; loadBooks(); }
    if (which === 'book') { tabBook.classList.add('on'); bookHost.style.display = ''; newBookView(); }
    if (which === 'quotes' || which === 'waiting') {
      waitingOnly = which === 'waiting';
      (waitingOnly ? tabWaiting : tabQuotes).classList.add('on');
      quoteHost.style.display = '';
      loadQuotes();
    }
  }
  tabClues.addEventListener('click', function () { showTab('clues'); });
  tabVars.addEventListener('click', function () { showTab('vars'); });
  tabBook.addEventListener('click', function () { showTab('book'); });
  tabQuotes.addEventListener('click', function () { showTab('quotes'); });
  tabWaiting.addEventListener('click', function () { showTab('waiting'); });
  tabTrails.addEventListener('click', function () { showTab('trails'); });
  tabShopping.addEventListener('click', function () { showTab('shopping'); });

  var gameSel = document.getElementById('game');
  fetch('/api/games').then(function (r) { return r.json(); }).then(function (games) {
    var here = games.filter(function (x) { return x.slug === GAME; })[0] || games[0];
    GAME_META = here;
    KIND = here.canon === 'books' ? 'book' : 'character';
    document.title = 'Deck manager — ' + here.title;
    tabBook.textContent = 'add a ' + KIND;

    // A quote deck has no pictures, so the pictures and variants tabs would be
    // empty and the add-a-picture form meaningless. It gets the quotes tabs
    // instead, and opens on the one that gets used most: the lines still
    // waiting to be pasted in.
    if (here.kind === 'trails') {
      // A trail deck has no rebus clues and no books to add. It opens on the
      // shopping list, because "what is still to find" is the question this
      // page exists to answer.
      tabClues.style.display = 'none';
      tabVars.style.display = 'none';
      tabBook.style.display = 'none';
      tabTrails.style.display = '';
      tabShopping.style.display = '';
      q.placeholder = 'filter by person or id';
      q.addEventListener('input', function () {
        if (trailHost.style.display !== 'none') { loadTrails(); }
      });
      showTab('shopping');
    }

    if (here.kind === 'quotes') {
      tabClues.style.display = 'none';
      tabVars.style.display = 'none';
      tabBook.style.display = 'none';
      tabQuotes.style.display = '';
      tabWaiting.style.display = '';
      q.placeholder = 'filter is on the quotes tabs';
      // Open on "waiting for text" only if anything IS waiting. Who Said It?
      // has a half-translated Tagalog side, so that tab is the job; Who Did
      // It? wrote its own sentences and nothing there ever waits, so opening
      // on it means landing on an empty page every single time.
      fetch('/api/quotes?game=' + encodeURIComponent(GAME))
        .then(function (r) { return r.json(); })
        .then(function (rows) {
          var waiting = rows.some(function (r) {
            return (r.quotes || []).some(function (qt) { return qt.waiting; });
          });
          showTab(waiting ? 'waiting' : 'quotes');
        })
        .catch(function () { showTab('waiting'); });
    }
    games.forEach(function (x) {
      var o = document.createElement('option');
      o.value = x.slug;
      o.textContent = x.title;
      if (x.slug === GAME) { o.selected = true; }
      if (!x.exists) { o.disabled = true; o.textContent += ' (no deck yet)'; }
      gameSel.appendChild(o);
    });
    gameSel.addEventListener('change', function () {
      // A full reload rather than a redraw: it clears every half-filled upload
      // form on the page, which would otherwise post into the new game.
      location.search = '?game=' + encodeURIComponent(gameSel.value);
    });
  });

  fetch(api('/api/clues')).then(function (r) { return r.json(); }).then(function (list) {
    clues = list;
    draw();
  }).catch(function (e) {
    grid.appendChild(el('p', null, 'Could not load the deck: ' + e.message
      + ' — is this served by node tools/manage.js?'));
  });

  q.addEventListener('input', draw);
})();
</script>
</body>
</html>
