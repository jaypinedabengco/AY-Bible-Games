<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deck review — Bible Book Names</title>
<link rel="stylesheet" href="../core/theme.css">
<style>
  body { overflow: auto; }
  .bar {
    position: sticky; top: 0; z-index: 5; background: var(--bg);
    border-bottom: 1px solid #262d3a; padding: 0.9rem 1.2rem;
    display: flex; gap: 0.8rem; align-items: center; flex-wrap: wrap;
  }
  .bar h1 { font-size: 1rem; margin: 0; letter-spacing: 0.14em; text-transform: uppercase;
            color: var(--dim); }
  .bar input[type=search] {
    flex: 1 1 14rem; font-size: 1rem; padding: 0.5rem 0.8rem; border-radius: 0.5rem;
    border: 1px solid #2c3444; background: var(--card); color: var(--fg);
  }
  .bar button {
    font: inherit; font-size: 0.85rem; padding: 0.5rem 0.9rem; border-radius: 0.5rem;
    border: 1px solid #2c3444; background: var(--card); color: var(--fg); cursor: pointer;
  }
  .bar button.on { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  .count { font-size: 0.85rem; color: var(--dim); }

  .grid { display: grid; gap: 1rem; padding: 1.2rem;
          grid-template-columns: repeat(auto-fill, minmax(20rem, 1fr)); }
  .cell { background: var(--card); border-radius: 0.8rem; padding: 0.9rem;
          border: 2px solid transparent; cursor: pointer; }
  .cell.bad { border-color: var(--bad); }
  .cell.bad .verdict { color: var(--bad); }

  .pics { display: flex; gap: 0.5rem; align-items: flex-end; flex-wrap: wrap; }
  .pic { display: flex; flex-direction: column; align-items: center; gap: 0.3rem;
         max-width: 8.5rem; }
  .pic img { height: 7rem; max-width: 8.5rem; object-fit: contain;
             background: #0d1017; border-radius: 0.4rem; padding: 0.25rem; }
  .pic .miss { height: 7rem; width: 6rem; display: grid; place-items: center;
               font-size: 2.4rem; color: var(--bad); border: 2px dashed var(--bad);
               border-radius: 0.4rem; }
  .pic .word { font-size: 0.85rem; letter-spacing: 0.08em; color: var(--accent); }
  .pic .file { font-size: 0.6rem; color: var(--dim); word-break: break-all; text-align: center; }
  .plus { font-size: 1.4rem; color: var(--accent); padding-bottom: 2rem; }

  .ans { font-size: 1.5rem; font-weight: 700; margin-top: 0.7rem; }
  .sub { font-size: 0.7rem; color: var(--dim); letter-spacing: 0.1em;
         text-transform: uppercase; margin-top: 0.15rem; }
  .tags { display: flex; gap: 0.3rem; flex-wrap: wrap; margin-top: 0.5rem; }
  .tag { font-size: 0.6rem; letter-spacing: 0.12em; text-transform: uppercase;
         padding: 0.15rem 0.45rem; border-radius: 1rem; background: var(--bg); color: var(--dim); }
  .tag.risky { background: var(--bad); color: #fff; }
  .tag.local { background: var(--accent); color: var(--bg); }
  .tag.small { background: #7a4a12; color: #ffd9a3; }
  .verdict { font-size: 0.68rem; color: var(--dim); margin-top: 0.4rem; }
  .out { padding: 0 1.2rem 3rem; }
  .out textarea { width: 100%; height: 8rem; background: var(--card); color: var(--fg);
                  border: 1px solid #2c3444; border-radius: 0.5rem; padding: 0.7rem;
                  font-family: ui-monospace, monospace; font-size: 0.8rem; }
</style>
</head>
<body>
<div class="bar">
  <h1>Deck review</h1>
  <input id="q" type="search" placeholder="filter by id, answer or filename — e.g. bn-07, ham, LEVI">
  <button id="onlyFlagged">only flagged</button>
  <button id="onlyMarked">only marked</button>
  <button id="onlySmall">only small art</button>
  <button id="copy">copy marked list</button>
  <span class="count" id="count"></span>
</div>

<div class="grid" id="grid"></div>
<div class="out"><textarea id="dump" readonly placeholder="Marked pictures appear here — click any card to mark it, then Copy."></textarea></div>

<script src="../core/normalize.js"></script>
<script src="../core/views.js"></script>
<script src="../games/book-names/deck.js"></script>
<script>
(function () {
  var deck = BibleGames.normalize.normalizeDeck(window.DECK);
  var dir = '../games/book-names/images/';
  var grid = document.getElementById('grid');
  var q = document.getElementById('q');
  var countEl = document.getElementById('count');
  var dump = document.getElementById('dump');
  var STORE = 'deck-review-marked';

  var marked = {};
  try { marked = JSON.parse(localStorage.getItem(STORE) || '{}'); } catch (e) { marked = {}; }

  var only = { flagged: false, marked: false, small: false };

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) { n.className = cls; }
    if (text != null) { n.textContent = text; }
    return n;
  }

  // One row per puzzle VARIANT - a puzzle with two pictures has two rows, and
  // both need reviewing.
  var rows = [];
  deck.puzzles.forEach(function (p) {
    p.variants.forEach(function (v, i) {
      var names = v.clues ? v.clues.map(function (c) { return c.img; })
                          : (v.img ? [v.img] : []);
      var words = v.clues ? v.clues.map(function (c) { return c.word; }) : [null];
      rows.push({
        puzzle: p, variant: v, index: i, many: p.variants.length > 1,
        names: names, words: words,
        hay: [p.id, p.answer, v.type, v.flag].concat(names).concat(words)
               .filter(Boolean).join(' ').toLowerCase(),
      });
    });
  });

  function save() {
    try { localStorage.setItem(STORE, JSON.stringify(marked)); } catch (e) { /* private mode */ }
    var list = Object.keys(marked).filter(function (k) { return marked[k]; }).sort();
    dump.value = list.length
      ? list.join('\n')
      : '';
    document.getElementById('copy').textContent =
      list.length ? 'copy ' + list.length + ' marked' : 'copy marked list';
  }

  function card(row) {
    var cell = el('div', 'cell');
    var key = row.puzzle.id + (row.many ? '#' + (row.index + 1) : '');
    if (marked[key]) { cell.classList.add('bad'); }

    var pics = el('div', 'pics');
    row.names.forEach(function (n, i) {
      if (i > 0) { pics.appendChild(el('div', 'plus', '+')); }
      var box = el('div', 'pic');
      var img = document.createElement('img');
      img.src = dir + n;
      img.alt = n;
      img.loading = 'lazy';
      img.addEventListener('error', function () {
        var miss = el('div', 'miss', '?');
        miss.title = n + ' not found';
        img.replaceWith(miss);
      });
      // Flag art that will look soft blown up on a hall screen.
      img.addEventListener('load', function () {
        if (img.naturalWidth && img.naturalWidth < 600) {
          cell.dataset.small = '1';
          var t = el('span', 'tag small', img.naturalWidth + 'px');
          cell.querySelector('.tags').appendChild(t);
        }
      });
      box.appendChild(img);
      if (row.words[i]) { box.appendChild(el('div', 'word', row.words[i])); }
      box.appendChild(el('div', 'file', n));
      pics.appendChild(box);
    });
    cell.appendChild(pics);

    cell.appendChild(el('div', 'ans', row.puzzle.answer));
    var ref = BibleGames.views.formatRef(row.puzzle.ref);
    cell.appendChild(el('div', 'sub', '#' + row.puzzle.id + (ref ? ' · ' + ref : '')));

    var tags = el('div', 'tags');
    tags.appendChild(el('span', 'tag', row.variant.type));
    tags.appendChild(el('span', 'tag', 'd' + row.variant.difficulty));
    if (row.many) { tags.appendChild(el('span', 'tag', 'variant ' + (row.index + 1) + ' of ' + row.puzzle.variants.length)); }
    if (row.variant.flag) { tags.appendChild(el('span', 'tag ' + row.variant.flag, row.variant.flag)); }
    cell.appendChild(tags);
    cell.appendChild(el('div', 'verdict', marked[key] ? 'MARKED — needs a better picture' : 'click to mark'));

    cell.addEventListener('click', function () {
      marked[key] = !marked[key];
      if (marked[key]) {
        marked[key] = row.names.join(' ') + '   (' + row.puzzle.answer + ' ' + key + ')';
      } else {
        delete marked[key];
      }
      cell.classList.toggle('bad');
      cell.querySelector('.verdict').textContent =
        marked[key] ? 'MARKED — needs a better picture' : 'click to mark';
      save();
    });
    return cell;
  }

  function draw() {
    grid.innerHTML = '';
    var term = q.value.trim().toLowerCase();
    var shown = 0;
    rows.forEach(function (row) {
      var key = row.puzzle.id + (row.many ? '#' + (row.index + 1) : '');
      if (term && row.hay.indexOf(term) === -1) { return; }
      if (only.flagged && !row.variant.flag) { return; }
      if (only.marked && !marked[key]) { return; }
      var c = card(row);
      if (only.small) { c.style.display = 'none';
        // revealed by the load handler once a small image is detected
        var iv = setInterval(function () {
          if (c.dataset.small) { c.style.display = ''; clearInterval(iv); }
        }, 120);
        setTimeout(function () { clearInterval(iv); }, 4000);
      }
      grid.appendChild(c);
      shown++;
    });
    countEl.textContent = shown + ' of ' + rows.length + ' cards · '
      + deck.puzzles.length + ' books';
  }

  q.addEventListener('input', draw);
  [['onlyFlagged', 'flagged'], ['onlyMarked', 'marked'], ['onlySmall', 'small']]
    .forEach(function (pair) {
      var btn = document.getElementById(pair[0]);
      btn.addEventListener('click', function () {
        only[pair[1]] = !only[pair[1]];
        btn.classList.toggle('on', only[pair[1]]);
        draw();
      });
    });
  document.getElementById('copy').addEventListener('click', function () {
    dump.select();
    try { document.execCommand('copy'); } catch (e) { /* just leave it selected */ }
  });

  save();
  draw();
})();
</script>
</body>
</html>
