<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game master — AY Bible Games</title>
<link rel="stylesheet" href="core/theme.css">
<style>
  body { overflow: auto; }
  .wrap { max-width: 40rem; margin: 0 auto; padding: 1.2rem 1rem 4rem; }
  h1 { font-size: 1.3rem; margin: 0 0 0.2rem; }
  .sub { color: var(--dim); font-size: 0.8rem; margin: 0 0 1.4rem; }
  input { width: 100%; font-size: 1.15rem; padding: 0.75rem 0.9rem; border-radius: 0.6rem;
          border: 1px solid #2c3444; background: var(--card); color: var(--fg); }
  #signin { width: 100%; margin-top: 0.7rem; font: inherit; font-size: 1.05rem;
            padding: 0.75rem; border-radius: 0.6rem; border: none;
            background: var(--accent); color: var(--bg); font-weight: 700;
            cursor: pointer; }
  .note { color: var(--dim); font-size: 0.85rem; margin: 0.7rem 0 0; line-height: 1.5; }
  .note strong { color: var(--accent); }
  .bad { color: var(--bad); }
  .hide { display: none; }

  .sticky { position: sticky; top: 0; background: var(--bg); padding: 0.6rem 0 0.7rem; z-index: 3; }

  /* Which game's answers you are looking at. The game master is holding a
     phone in a dark hall, so this is a row of big targets, not a dropdown. */
  .gmnav { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-bottom: 0.6rem; }
  .gmnav button { font: inherit; font-size: 0.78rem; letter-spacing: 0.04em;
                  padding: 0.4rem 0.8rem; border-radius: 1rem; background: var(--card);
                  color: var(--dim); border: 1px solid #2c3444; cursor: pointer; }
  .gmnav button.here { background: var(--accent); color: var(--bg);
                       border-color: var(--accent); font-weight: 700; }

  .row { background: var(--card); border-radius: 0.7rem; padding: 0.75rem 0.9rem;
         margin-top: 0.55rem; }
  .rid { font-size: 0.68rem; letter-spacing: 0.2em; color: var(--dim); text-transform: uppercase; }
  .ranswer { font-size: 1.7rem; font-weight: 700; line-height: 1.1; }
  /* The same person in the other language. The game master may be running the
     round in Tagalog, so this has to be readable at a glance rather than
     hidden in the small print of a quote block. */
  .ralt { font-size: 1.15rem; font-weight: 700; color: var(--accent);
          line-height: 1.2; margin-top: 0.1rem; }
  .ralt .lang { font-size: 0.6rem; letter-spacing: 0.14em; text-transform: uppercase;
                color: var(--dim); font-weight: 400; margin-right: 0.35rem; }
  .rwork { font-size: 1rem; letter-spacing: 0.08em; color: var(--accent); margin-top: 0.15rem; }
  .rref { font-size: 0.7rem; color: var(--dim); letter-spacing: 0.1em;
          text-transform: uppercase; margin-top: 0.3rem; }
  .tag { font-size: 0.6rem; letter-spacing: 0.14em; text-transform: uppercase;
         padding: 0.12rem 0.45rem; border-radius: 1rem; background: var(--bg);
         color: var(--dim); margin-right: 0.3rem; }
  .tag.risky { background: var(--bad); color: #fff; }
  .tag.local { background: var(--accent); color: var(--bg); }
  .tag.unverified { background: var(--accent); color: var(--bg); }
  .count { font-size: 0.75rem; color: var(--dim); margin-top: 0.5rem; }
  .pics { display: flex; gap: 0.4rem; align-items: center; flex-wrap: wrap;
          margin-bottom: 0.55rem; }
  .pics img { height: 4.2rem; max-width: 5.5rem; object-fit: contain;
              background: var(--bg); border-radius: 0.4rem; padding: 0.2rem; }
  .pics .plus { color: var(--accent); font-size: 1.1rem; }
  .pics .miss { height: 4.2rem; width: 3.4rem; display: grid; place-items: center;
                color: var(--bad); font-size: 1.6rem; border: 2px dashed var(--bad);
                border-radius: 0.4rem; }
  .pics .alt { font-size: 0.6rem; color: var(--dim); letter-spacing: 0.12em;
               text-transform: uppercase; align-self: flex-end; }
  #pictoggle { width: auto; margin-top: 0.5rem; font-size: 0.85rem;
               padding: 0.45rem 0.8rem; }

  /* Clearing what has been asked. It lives here rather than on the projector
     because it throws away weeks of a programme's progress, and the projector
     is in a room full of people who can reach the laptop. */
  .asked { margin-top: 0.6rem; font-size: 0.78rem; color: var(--dim);
           line-height: 1.5; }
  .asked button { font: inherit; font-size: 0.78rem; padding: 0.35rem 0.7rem;
                  margin-top: 0.35rem; border-radius: 0.5rem;
                  border: 1px solid #2c3444; background: var(--card);
                  color: var(--fg); cursor: pointer; display: block; }
  .asked button.armed { background: var(--bad); color: #fff; border-color: var(--bad); }

  .gmquote { border-left: 0.2rem solid var(--accent); padding-left: 0.6rem;
             margin-bottom: 0.6rem; }
  .gmquote.waiting { border-left-color: var(--dim); opacity: 0.7; }
  .gmq { font-size: 1.05rem; line-height: 1.35; }
  .gmquote.waiting .gmq { font-style: italic; color: var(--dim); font-size: 0.9rem; }
  .gmv { font-size: 0.72rem; color: var(--accent); letter-spacing: 0.1em;
         text-transform: uppercase; margin-top: 0.15rem; }
  .gmc { font-size: 0.8rem; color: var(--dim); margin-top: 0.2rem; }
</style>
</head>
<body>
<div class="wrap">
  <p style="margin:0 0 0.6rem;font-size:0.8rem">
    <a id="to-game" href="index.html" style="color:var(--accent);text-decoration:none"></a>
    <span id="to-game-sep" style="color:var(--dim)"></span>
    <a href="index.html" style="color:var(--dim);text-decoration:none">all games</a>
  </p>
  <h1>Game master</h1>
  <p class="sub">San Fernando Adventist Church</p>

  <div id="gate">
    <input id="user" type="text" autocomplete="off" autocapitalize="off"
           spellcheck="false" placeholder="Username" autofocus>
    <input id="pass" type="password" autocomplete="off" autocapitalize="off"
           spellcheck="false" placeholder="Password" style="margin-top:0.55rem">
    <button id="signin" type="button">Sign in</button>
    <p class="note" id="gate-note">The projector prints an id like
      <strong>#bn-07</strong> in the bottom corner. Sign in, pick the game,
      then find that id.</p>
  </div>

  <div id="list" class="hide">
    <div class="sticky">
      <div class="gmnav" id="gmnav"></div>
      <input id="filter" type="search" inputmode="search" autocomplete="off"
             placeholder="Type an id or an answer">
      <div class="count" id="count"></div>
      <button id="pictoggle" type="button">hide pictures</button>
      <div class="asked" id="asked"></div>
    </div>
    <div id="rows"></div>
  </div>
</div>

<script src="games.js"></script>
<script src="core/normalize.js"></script>
<script src="core/views.js"></script>
<script src="core/gm.js"></script>
<script src="gm-config.js"></script>

<!--
  Every deck, in one page. A deck assigns window.DECK, so each one is captured
  into a registry immediately after it loads - script tags run in order, so
  this works with no build step and no fetch(), which is what lets this page
  open from a USB stick as well as from the published site.
-->
<script>window.DECKS = [];</script>
<script src="games/book-names/deck.js"></script>
<script>window.DECKS.push({ slug: 'book-names', deck: window.DECK });</script>
<script src="games/who-said-it/deck.js"></script>
<script>window.DECKS.push({ slug: 'who-said-it', deck: window.DECK });</script>
<script src="games/character-names/deck.js"></script>
<script>window.DECKS.push({ slug: 'character-names', deck: window.DECK });</script>
<script src="games/object-trail/deck.js"></script>
<script>window.DECKS.push({ slug: 'object-trail', deck: window.DECK });</script>
<script src="games/who-did-it/deck.js"></script>
<script>window.DECKS.push({ slug: 'who-did-it', deck: window.DECK });</script>

<script>
  (function () {
    var gate = document.getElementById('gate');
    var list = document.getElementById('list');
    var userBox = document.getElementById('user');
    var passBox = document.getElementById('pass');
    var signin = document.getElementById('signin');
    var note = document.getElementById('gate-note');
    var host = document.getElementById('rows');
    var filter = document.getElementById('filter');
    var countEl = document.getElementById('count');
    var navEl = document.getElementById('gmnav');
    var picBtn = document.getElementById('pictoggle');

    function fail(msg) {
      host.innerHTML = '';
      var p = document.createElement('p');
      p.className = 'note bad';
      p.textContent = msg;
      document.querySelector('.wrap').appendChild(p);
    }

    if (!window.BibleGames || !window.BibleGames.gm || !window.GM_CONFIG
        || !window.DECKS || !window.DECKS.length) {
      // Same reasoning as the game pages: never a blank screen.
      fail('This page did not load properly. Reload it.');
      return;
    }

    // Only games that are actually playable, in catalogue order, so this page
    // never offers a deck with nothing in it.
    var games = window.DECKS
      .filter(function (d) { return d.deck && d.deck.puzzles && d.deck.puzzles.length; })
      .map(function (d) {
        return {
          slug: d.slug,
          deckId: d.deck.id || d.slug,
          title: d.deck.title || d.slug,
          images: 'games/' + d.slug + '/images/',
          rows: BibleGames.gm.rows(d.deck),
        };
      });

    if (!games.length) { fail('No deck has any puzzles yet.'); return; }

    var showPics = true;
    try { showPics = localStorage.getItem('gm-pics') !== 'off'; } catch (e) { /* private mode */ }

    var current = games[0];
    try {
      var saved = localStorage.getItem('gm-game');
      games.forEach(function (g) { if (g.slug === saved) { current = g; } });
    } catch (e) { /* private mode: just start on the first */ }

    function el(tag, cls, text) {
      var n = document.createElement(tag);
      if (cls) { n.className = cls; }
      if (text != null) { n.textContent = text; }
      return n;
    }

    // Straight to the game whose answers are on screen. Going out to the front
    // page and finding the card again is the wrong ask of someone holding a
    // phone in a dark hall.
    var toGame = document.getElementById('to-game');
    var toGameSep = document.getElementById('to-game-sep');

    function drawToGame() {
      toGame.textContent = '\u2190 ' + current.title;
      toGame.href = 'games/' + current.slug + '/index.html';
      toGameSep.textContent = '  \u00b7  ';
    }

    function drawNav() {
      navEl.innerHTML = '';
      if (games.length < 2) { return; }
      games.forEach(function (g) {
        var b = document.createElement('button');
        b.type = 'button';
        b.textContent = g.title;
        if (g === current) { b.className = 'here'; }
        b.addEventListener('click', function () {
          current = g;
          try { localStorage.setItem('gm-game', g.slug); } catch (e) { /* private */ }
          drawNav();
          drawToGame();
          syncPicBtn();
          drawAsked();
          draw(filter.value);
        });
        navEl.appendChild(b);
      });
    }

    function hasPictures(g) {
      return g.rows.some(function (r) {
        if (r.pictures.some(function (set) { return set.length; })) { return true; }
        // A trail keeps its pictures inside its steps.
        return (r.trails || []).some(function (t) {
          return t.some(function (step) { return (step.imgs || []).length; });
        });
      });
    }

    function draw(term) {
      host.innerHTML = '';
      var q = String(term || '').trim().toLowerCase();
      var shown = 0;
      current.rows.forEach(function (r) {
        if (q && r.id.toLowerCase().indexOf(q) === -1
              && r.answer.toLowerCase().indexOf(q) === -1) { return; }
        var box = el('div', 'row');
        box.appendChild(el('div', 'rid', '#' + r.id));

        // The same pictures the room is looking at: useful for seeing what
        // they are stuck on, and for reviewing artwork from a phone.
        if (showPics) {
          r.pictures.forEach(function (set, vi) {
            if (!set.length) { return; }
            var strip = el('div', 'pics');
            if (r.pictures.length > 1) { strip.appendChild(el('span', 'alt', 'or')); }
            set.forEach(function (name, i) {
              if (i > 0) { strip.appendChild(el('span', 'plus', '+')); }
              var img = document.createElement('img');
              img.src = current.images + name;
              img.alt = name;
              img.loading = 'lazy';
              img.addEventListener('error', function () {
                var miss = el('div', 'miss', '?');
                miss.title = name;
                img.replaceWith(miss);
              });
              strip.appendChild(img);
            });
            box.appendChild(strip);
          });
        }

        // Every line this puzzle might ask, in either language, including the
        // ones still waiting for their text.
        r.quotes.forEach(function (qt) {
          var block = el('div', qt.waiting ? 'gmquote waiting' : 'gmquote');
          block.appendChild(el('div', 'gmq', qt.waiting
            ? '(waiting for the ' + (qt.lang === 'fil' ? 'Tagalog' : 'English') + ' line)'
            : (qt.spoken === false ? qt.quote : '“' + qt.quote + '”')));
          var meta = [];
          if (qt.verse) { meta.push(qt.verse); }
          if (qt.lang === 'fil') { meta.push('Tagalog · ' + qt.answer); }
          if (meta.length) { block.appendChild(el('div', 'gmv', meta.join('  ·  '))); }
          if (qt.clue) { block.appendChild(el('div', 'gmc', 'clue: ' + qt.clue)); }
          box.appendChild(block);
        });

        // A trail's objects, step by step, with where each came from.
        (r.trails || []).forEach(function (trail, ti) {
          var block = el('div', 'gmquote');
          if ((r.trails || []).length > 1) {
            block.appendChild(el('div', 'gmv', 'trail ' + (ti + 1)));
          }
          trail.forEach(function (step, si) {
            var line = el('div', 'gmq', (si + 1) + '.  ' + step.words);
            line.style.fontSize = '0.95rem';
            block.appendChild(line);
            // The pictures the room is looking at, where they have been
            // sourced. A step with none is normal - the trail is written in
            // words and grows pictures - so nothing is drawn for it.
            if (showPics && step.imgs && step.imgs.length) {
              var strip = el('div', 'pics');
              strip.style.marginTop = '0.25rem';
              step.imgs.forEach(function (name, i) {
                if (i > 0) { strip.appendChild(el('span', 'plus', '+')); }
                var img = document.createElement('img');
                img.src = current.images + name;
                img.alt = name;
                img.loading = 'lazy';
                img.style.height = '3rem';
                img.addEventListener('error', function () {
                  var miss = el('div', 'miss', '?');
                  miss.title = name;
                  img.replaceWith(miss);
                });
                strip.appendChild(img);
              });
              block.appendChild(strip);
            }
            if (step.verse) { block.appendChild(el('div', 'gmc', step.verse)); }
          });
          box.appendChild(block);
        });

        box.appendChild(el('div', 'ranswer', r.answer));
        // Every other language this puzzle is asked in, named.
        Object.keys(r.names || {}).forEach(function (lang) {
          if (lang === 'en') { return; }
          var line = el('div', 'ralt');
          line.appendChild(el('span', 'lang', lang === 'fil' ? 'Tagalog' : lang));
          line.appendChild(document.createTextNode(r.names[lang]));
          box.appendChild(line);
        });
        // On a quote or trail deck the working is already shown above.
        if (!r.quotes.length && !(r.trails || []).length) {
          r.workings.forEach(function (w) { box.appendChild(el('div', 'rwork', w)); });
        }
        if (r.ref) { box.appendChild(el('div', 'rref', r.ref)); }
        if (r.flags.length) {
          var tags = el('div', null);
          tags.style.marginTop = '0.4rem';
          r.flags.forEach(function (f) { tags.appendChild(el('span', 'tag ' + f, f)); });
          box.appendChild(tags);
        }
        host.appendChild(box);
        shown++;
      });
      countEl.textContent = shown + ' of ' + current.rows.length + ' in ' + current.title;
    }

    // What the projector has already asked, and the only way to forget it.
    var askedEl = document.getElementById('asked');

    function askedKey(deckId) { return 'asked:' + (deckId || 'deck'); }

    function askedCount(deckId) {
      try {
        var raw = localStorage.getItem(askedKey(deckId));
        var list = raw ? JSON.parse(raw) : [];
        return Array.isArray(list) ? list.length : 0;
      } catch (e) { return 0; }   // private window
    }

    function drawAsked() {
      askedEl.innerHTML = '';
      var deckId = current.deckId;
      var n = askedCount(deckId);
      if (!n) {
        askedEl.textContent = 'Nothing asked yet in ' + current.title
          + ' on this device.';
        return;
      }
      // "On this device" is not padding. The record lives in the browser
      // running the GAME, so a game master clearing it from their own phone
      // would change nothing on the laptop driving the projector - and would
      // have no way of telling.
      askedEl.appendChild(document.createTextNode(
        n + ' already asked in ' + current.title + ' on this device, and not '
        + 'coming back. Clear it on the laptop running the game.'));
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = 'Ask them all again';
      var armed = false;
      b.addEventListener('click', function () {
        // Two presses. One press throws away weeks of a programme, and this is
        // a phone screen being tapped in the dark.
        if (!armed) {
          armed = true;
          b.className = 'armed';
          b.textContent = 'Tap again to forget all ' + n;
          return;
        }
        try { localStorage.removeItem(askedKey(deckId)); } catch (e) { /* private */ }
        drawAsked();
      });
      askedEl.appendChild(b);
    }

    function syncPicBtn() {
      // A quote deck has no pictures to toggle.
      if (!hasPictures(current)) { picBtn.classList.add('hide'); return; }
      picBtn.classList.remove('hide');
      picBtn.textContent = showPics ? 'hide pictures' : 'show pictures';
    }

    function unlock() {
      gate.classList.add('hide');
      list.classList.remove('hide');
      drawNav();
      drawToGame();
      syncPicBtn();
      drawAsked();
      draw('');
      filter.focus();
    }

    function trySignIn() {
      if (BibleGames.gm.matchesLogin(userBox.value, passBox.value,
                                     window.GM_CONFIG.loginHash)) {
        try { sessionStorage.setItem('gm', '1'); } catch (e) { /* private mode */ }
        unlock();
      } else {
        note.className = 'note bad';
        note.textContent = 'That username or password is not right. '
          + 'Ask whoever set the game up.';
        passBox.value = '';
        passBox.focus();
      }
    }

    try {
      if (sessionStorage.getItem('gm') === '1') { unlock(); }
    } catch (e) { /* private mode: just ask for the code */ }

    signin.addEventListener('click', trySignIn);
    [userBox, passBox].forEach(function (box) {
      box.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { trySignIn(); }
      });
    });
    filter.addEventListener('input', function () { draw(filter.value); });
    picBtn.addEventListener('click', function () {
      showPics = !showPics;
      try { localStorage.setItem('gm-pics', showPics ? 'on' : 'off'); } catch (e) { /* private */ }
      syncPicBtn();
      draw(filter.value);
    });
  })();
</script>
</body>
</html>
